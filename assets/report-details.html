<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>report details</title>
    <link rel="shortcut icon" href="./assets/images/Icon.svg" type="image/x-icon">

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Sidebar Section -->
    <div id="sidebar" class="sidebar">
        <img id="sidebarLogo" src="./images/Frame 1.png" alt="Logo">
        <ul id="sidebarNavList">
            <li><a id="linkDashboard" href="index.html">Dashboard</a></li>
            <li><a id="linkReports" href="reports.html">Reports</a></li>
            <li><a id="linkReportDetails" href="report-details.html">Report details</a></li>
            <li><a id="linkMyView" href="myview.html">My View</a></li>
            <li><a id="linkUsers" href="users.html">Users & Roles</a></li>
            <li><a id="linkSettings" href="settings.html">Settings</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent" class="main">

        <!-- Header / Topbar -->
        <div id="topbar" class="topbar d-flex align-items-center justify-content-between p-3 mb-4 bg-white rounded-3 shadow-sm">
            <h2 id="pageTitle">Report Details</h2>
        </div>

        <!-- Report Status Header -->
        <div id="reportStatusHeader" class="d-flex justify-content-between align-items-center border rounded-3 p-3 mb-4 bg-white" style="border-color: #d0d7de !important">
            <div id="statusDropdownContainer" class="dropdown">
                <button id="statusDropdownBtn" class="btn btn-warning rounded-pill dropdown-toggle fw-semibold" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    In Progress
                </button>
                <ul id="statusDropdownMenu" class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">In Progress</a></li>
                    <li><a class="dropdown-item" href="#">Solved</a></li>
                    <li><a class="dropdown-item" href="#">Cancelled</a></li>
                    <li><a class="dropdown-item" href="#">Pending</a></li>
                </ul>
            </div>
        </div>

        <!-- Report Banner Photo -->
        <div id="reportPhotoContainer" class="mb-4 bg-white rounded-3 overflow-hidden">
            <img id="reportPhoto" src="https://via.placeholder.com/1180x104" alt="Report Photo" class="img-fluid w-100" style="height: 104px; object-fit: cover;" />
        </div>

        <!-- Report Details Form Section -->
        <form id="reportDetailsForm">
            <div id="detailsContainer" class="container my-4 px-0">
                <div class="row g-4">
                    <!-- Map Column -->
                    <div id="mapColumn" class="col-md-6 bg-white rounded-3 p-3 shadow-sm">
                        <label id="mapLabel" class="form-label fw-semibold mb-2">Location on map</label>
                        <iframe id="googleMapFrame"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0198461272894!2d-122.47111418468138!3d37.77397227975814!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085817c6a36e2ef%3A0x8063c7e484dbd2a1!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2seg!4v1679066144069!5m2!1sen!2seg"
                            width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>

                    <!-- Information Column -->
                    <div id="infoColumn" class="col-md-6 bg-white rounded-3 p-3 shadow-sm d-flex flex-column">
                        <!-- Problem Description -->
                        <label for="describeProblem" class="form-label fw-semibold">Describe Problem</label>
                        <textarea id="describeProblem" class="form-control mb-3" rows="5" required>Lorem ipsum dolor sit amet consectetur. Odio risus in tortor fermentum habitasse. Sed fermentum aenean erat ipsum facilisis ultricies porttitor. Egestas pharetra morbi tristique consectetur blandit eu dolor. Tellus suscipit rhoncus scelerisque in gravida gravida massa.</textarea>

                        <!-- Date Input -->
                        <label for="date" class="form-label fw-semibold">Date</label>
                        <input type="date" id="date" class="form-control mb-3" value="2025-02-10" required />

                        <!-- Location Input -->
                        <label for="location" class="form-label fw-semibold">Location</label>
                        <input type="text" id="location" class="form-control mb-3" value="Port Said, Port Fouad City, Port Said Governorate" required />

                        <!-- Type Checkboxes -->
                        <label class="form-label fw-semibold">Type</label>
                        <div id="typeCheckboxes" class="mb-3">
                            <div class="form-check form-check-inline">
                                <input id="typeRoads" class="form-check-input" type="checkbox" value="Roads" checked />
                                <label class="form-check-label" for="typeRoads">Roads</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input id="typeLights" class="form-check-input" type="checkbox" value="Lights" checked />
                                <label class="form-check-label" for="typeLights">Lights</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input id="typeClean" class="form-check-input" type="checkbox" value="Clean" checked />
                                <label class="form-check-label" for="typeClean">Clean</label>
                            </div>
                        </div>

                        <!-- Priority Radio Buttons -->
                        <label class="form-label fw-semibold">Priority</label>
                        <div id="priorityRadios" class="mb-3">
                            <div class="form-check form-check-inline">
                                <input id="priorityHigh" class="form-check-input" type="radio" name="priority" value="High" checked />
                                <label class="form-check-label badge rounded-pill bg-success text-white px-3 py-2" for="priorityHigh">High</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input id="priorityMedium" class="form-check-input" type="radio" name="priority" value="Medium" />
                                <label class="form-check-label badge rounded-pill bg-warning text-dark px-3 py-2" for="priorityMedium">Medium</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input id="priorityLow" class="form-check-input" type="radio" name="priority" value="Low" />
                                <label class="form-check-label badge rounded-pill bg-secondary text-white px-3 py-2" for="priorityLow">Low</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div id="actionButtons" class="mt-4 d-flex gap-3">
                <button id="btnCloseReport" type="submit" class="btn btn-primary px-4">Close Report</button>
                <button id="btnCancel" type="button" class="btn btn-dark px-4">Cancel</button>
            </div>
        </form>

    </div>

    <!-- Scripts Section -->
    <script id="mainScript" src="./js/main.js"></script>
    <script id="bootstrapScript" src="./js/bootstrap.bundle.min.js"></script>

    <!-- Sidebar Active Link Logic -->
    <script id="sidebarActiveHandler">
        document.addEventListener("DOMContentLoaded", function () {
            const links = document.querySelectorAll(".sidebar ul li a");
            links.forEach(link => {
                // لو رابط اللينك موجود جوه رابط الصفحة الحالي
                if (window.location.href.includes(link.getAttribute("href"))) {
                    link.parentElement.classList.add("active");
                }
            });
        });
    </script>

</body>

</html>
