<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my view</title>
    <link rel="shortcut icon" href="./assets/images/Icon.svg" type="image/x-icon">

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Sidebar Section -->
    <div id="sidebar" class="sidebar">
        <img id="sidebarLogo" src="./images/Frame 1.png" alt="Logo">
        <ul id="sidebarNavList">
            <li><a id="linkDashboard" href="index.html">Dashboard</a></li>
            <li><a id="linkReports" href="reports.html">Reports</a></li>
            <li><a id="linkMyView" href="myview.html">My View</a></li>
            <li><a id="linkUsers" href="users.html">Users & Roles</a></li>
            <li><a id="linkSettings" href="settings.html">Settings</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent" class="main">
                <!-- New Top Navbar (As requested from image) -->
        <nav id="navbarCustom" class="navbar-custom">
            <!-- Notification Icon Button -->
            <a href="#" id="notificationBtn" class="nav-icon-btn">
                <i class="fa-regular fa-bell"></i>
            </a>

            <!-- Messages Icon Button -->
            <a href="#" id="messagesBtn" class="nav-icon-btn">
                <i class="fa-regular fa-envelope"></i>
            </a>

            <!-- User Profile Dropdown -->
            <div id="userProfileDropdown" class="dropdown user-profile-dropdown">
                <div id="profileTrigger" class="dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                    <img id="userAvatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="User Avatar" class="user-avatar">
                </div>
                <ul id="profileDropdownMenu" class="dropdown-menu dropdown-menu-end profile-dropdown-menu">
                    <li><a id="loginLink" class="dropdown-item" href="login.html"><i class="fas fa-sign-in-alt me-2"></i>Login</a></li>
                    <li><a id="signupLink" class="dropdown-item" href="signup.html"><i class="fas fa-user-plus me-2"></i>Sign up</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a id="profileLink" class="dropdown-item" href="#"><i class="fas fa-user-circle me-2"></i>Profile</a></li>
                </ul>
            </div>
        </nav>

        <!-- Header / Topbar with Dropdowns -->
        <div id="topbar" class="d-flex align-items-center justify-content-between p-3 mb-4 bg-white rounded-3 shadow-sm">
            <h2 id="pageTitle" class="mb-0">My View</h2>

            <!-- Filter Controls -->
            <div id="filterControls" class="d-flex align-items-center gap-3">
                <!-- Status Dropdown -->
                <div class="dropdown">
                    <button id="statusDropdownBtn" class="btn btn-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Statues
                    </button>
                    <ul id="statusDropdownMenu" class="dropdown-menu" aria-labelledby="statusDropdownBtn">
                        <li><a class="dropdown-item" href="#">Action 1</a></li>
                        <li><a class="dropdown-item" href="#">Action 2</a></li>
                        <li><a class="dropdown-item" href="#">Action 3</a></li>
                    </ul>
                </div>

                <!-- Category Dropdown -->
                <div class="dropdown">
                    <button id="categoryDropdownBtn" class="btn btn-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Category
                    </button>
                    <ul id="categoryDropdownMenu" class="dropdown-menu" aria-labelledby="categoryDropdownBtn">
                        <li><a class="dropdown-item" href="#">Option A</a></li>
                        <li><a class="dropdown-item" href="#">Option B</a></li>
                        <li><a class="dropdown-item" href="#">Option C</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Map Section -->
        <div id="mapContainer" class="col-md-6 bg-white rounded-3 p-3 shadow-sm">
            <label id="mapLabel" class="form-label fw-semibold mb-2">Location on map</label>
            <iframe id="googleMapFrame"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0198461272894!2d-122.47111418468138!3d37.77397227975814!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085817c6a36e2ef%3A0x8063c7e484dbd2a1!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2seg!4v1679066144069!5m2!1sen!2seg"
                width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

    </div>

    <!-- Scripts Section -->
    <script id="mainScript" src="./js/main.js"></script>
    <script id="bootstrapScript" src="./js/bootstrap.bundle.min.js"></script>

    <!-- Sidebar Active Link Logic -->
    <script id="sidebarActiveHandler">
        document.addEventListener("DOMContentLoaded", function () {
            const links = document.querySelectorAll(".sidebar ul li a");
            links.forEach(link => {
                // لو رابط اللينك موجود جوه رابط الصفحة الحالي
                if (window.location.href.includes(link.getAttribute("href"))) {
                    link.parentElement.classList.add("active");
                }
            });
        });
    </script>

</body>

</html>
